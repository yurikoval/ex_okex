name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-24.04
    name: OTP 29.1.2 / Elixir 1.20.4

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: 29.1.2
          elixir-version: 1.20.4

      - name: Cache Elixir
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
            _build/test
          key: elixir-cache-1.20.4-otp-29.1.2-${{runner.os}}-${{hashFiles('mix.lock')}}

      - name: Install Dependencies
        run: mix deps.get

      - name: Hex Audit, Test, Credo & Dialyzer
        run: bin/test
